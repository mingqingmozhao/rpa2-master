spring:
  application:
    name: rpa-application
  datasource:
    url: jdbc:h2:mem:financial_data_collect
    driver-class-name: org.h2.Driver
    username: root
    password: czm12345
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  secret: your-secret-key-at-least-32-bytes-long-1234567890
  expiration: 7200000
  rememberMeExpiration: 604800000

logging:
  level:
    com.rpa: DEBUG
    org.springframework: INFO
    org.hibernate: DEBUG