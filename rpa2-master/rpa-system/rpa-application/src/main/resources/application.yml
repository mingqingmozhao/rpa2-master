server:
  port: 8080

spring:
  application:
    name: rpa-system
  servlet:
    multipart:
      enabled: true
      max-file-size: 2MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/financial_data_collect?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: never

# 文件上传配置
file:
  upload:
    dir: uploads

jwt:
  secret: default-secret-key-for-development-only-must-be-long-enough
  expiration: 86400000
