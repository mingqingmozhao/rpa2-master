<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语法检查测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        textarea {
            width: 100%;
            height: 200px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
        }
        .error {
            background: #ffebee;
            border-left: 4px solid #f44336;
            color: #c62828;
        }
        .warning {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
            color: #e65100;
        }
        .success {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            color: #2e7d32;
        }
        .debug {
            margin-top: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Groovy 语法检查测试</h1>
    
    <textarea id="codeInput" placeholder="输入 Groovy 代码...">test123123</textarea>
    
    <button onclick="checkSyntax()">语法检查</button>
    
    <div id="result"></div>
    <div id="debug"></div>
    
    <script>
        function checkSyntax() {
            const code = document.getElementById('codeInput').value;
            const errors = [];
            const warnings = [];
            
            // 检查是否包含有效的 Groovy 代码结构
            const hasFunctionDef = /def\s+\w+\s*\(/.test(code);
            const hasVariableDef = /\bdef\s+\w+\s*=/.test(code);
            const hasMethodCall = /\b[a-zA-Z_]\w*\s*\([^)]*\)/.test(code);
            const hasComment = /\/\/|\/\*|\*\//.test(code);
            const hasString = /["'`][^"'`]*["'`]/.test(code);
            const hasKeyword = /\b(def|if|else|for|while|return|try|catch|throw|new|class|import)\b/.test(code);
            
            // 检查代码是否只是随意输入的无效文本
            const codeWithoutComments = code.replace(/\/\/.*$/gm, '').replace(/\/\*[\s\S]*?\*\//g, '').trim();
            
            // 调试信息
            let debugHtml = '<h3>调试信息：</h3>';
            debugHtml += `<p>hasFunctionDef: ${hasFunctionDef}</p>`;
            debugHtml += `<p>hasVariableDef: ${hasVariableDef}</p>`;
            debugHtml += `<p>hasMethodCall: ${hasMethodCall}</p>`;
            debugHtml += `<p>hasComment: ${hasComment}</p>`;
            debugHtml += `<p>hasString: ${hasString}</p>`;
            debugHtml += `<p>hasKeyword: ${hasKeyword}</p>`;
            debugHtml += `<p>codeWithoutComments: "${codeWithoutComments}"</p>`;
            
            if (codeWithoutComments) {
                // 检查是否只是一堆字母数字组合（随意输入的文本）
                const linesWithoutComments = codeWithoutComments.split('\n').filter(l => l.trim());
                const allLinesAreGibberish = linesWithoutComments.every(l => {
                    const trimmed = l.trim();
                    // 如果一行只是字母数字组合，没有空格、运算符等，很可能是乱输入的
                    return /^[a-zA-Z0-9_]+$/.test(trimmed) && trimmed.length < 50;
                });
                
                debugHtml += `<p>linesWithoutComments: ${JSON.stringify(linesWithoutComments)}</p>`;
                debugHtml += `<p>allLinesAreGibberish: ${allLinesAreGibberish}</p>`;
                
                if (allLinesAreGibberish && linesWithoutComments.length > 0) {
                    errors.push('代码看起来像随意输入的文本，不是有效的 Groovy 语法');
                    warnings.push('请编写有效的 Groovy 代码，如：def functionName() { ... }');
                }
            }
            
            // 显示调试信息
            document.getElementById('debug').innerHTML = debugHtml;
            
            // 显示结果
            const resultDiv = document.getElementById('result');
            
            if (errors.length > 0) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '<strong>❌ 语法检查失败</strong><br>' + errors.join('<br>');
                if (warnings.length > 0) {
                    resultDiv.innerHTML += '<br><br><strong>⚠️ 警告：</strong><br>' + warnings.join('<br>');
                }
            } else if (warnings.length > 0) {
                resultDiv.className = 'result warning';
                resultDiv.innerHTML = '<strong>⚠️ 语法检查完成（有警告）</strong><br>' + warnings.join('<br>');
            } else {
                resultDiv.className = 'result success';
                resultDiv.innerHTML = '<strong>✅ 语法检查通过（基础检查）</strong>';
            }
        }
    </script>
</body>
</html>
